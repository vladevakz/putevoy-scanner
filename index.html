<body>
    <div class="container">
        <h1>📄 Калькулятор путевых листов</h1>

        <!-- Нормы и сезон -->
        <div class="norms-compact">
            <div class="norm-block">
                <span>🏙️</span>
                <label>Л <input type="number" id="normCitySummer" value="11.7" step="0.1"></label>
                <label>З <input type="number" id="normCityWinter" value="13.0" step="0.1"></label>
            </div>
            <div class="norm-block">
                <span>🛣️</span>
                <label>Л <input type="number" id="normHwySummer" value="10.3" step="0.1"></label>
                <label>З <input type="number" id="normHwyWinter" value="11.0" step="0.1"></label>
            </div>
            <div class="season-inline">
                <label><input type="radio" name="season" value="auto" checked> А</label>
                <label><input type="radio" name="season" value="winter"> ❄️</label>
                <label><input type="radio" name="season" value="summer"> ☀️</label>
            </div>
        </div>
        <div id="weatherInfo" class="weather-info"></div>

        <!-- Поля ввода -->
        <div class="input-grid">
            <div class="input-item">
                <label>📅 Дата</label>
                <input type="date" id="dateInput">
            </div>
            <div class="input-item">
                <label>🚩 Нач. пробег (км)</label>
                <input type="number" id="startOdometer" step="0.1" placeholder="0">
                <small id="startOdometerHint"></small>
            </div>
            <div class="input-item">
                <label>⛽ Выезд (л)</label>
                <input type="number" id="startFuel" step="0.1" placeholder="0">
                <small id="startFuelHint"></small>
            </div>
            <div class="input-item">
                <label>🏙️ Город (км)</label>
                <input type="number" id="cityKm" step="0.1" placeholder="0">
            </div>
            <div class="input-item">
                <label>🛣️ Трасса (км)</label>
                <input type="number" id="highwayKm" step="0.1" placeholder="0">
            </div>
            <div class="input-item">
                <label>🛢️ Заправ (л)</label>
                <input type="number" id="fuelAdded" step="0.1" placeholder="0">
            </div>
        </div>

        <!-- Результаты -->
        <div id="resultsBlock" class="results-compact">
            <div id="liveResults">Введите данные</div>
        </div>

        <!-- Кнопки -->
        <div class="btn-group">
            <button id="saveBtn">💾 Сохранить</button>
            <button id="historyBtn" class="secondary">📋 История</button>
            <button id="pointsBtn" class="secondary">📌 Точки</button>
        </div>
    </div>

    <!-- Модальное окно истории -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeHistoryModal">&times;</span>
            <h2>📚 Сохранённые расчёты</h2>
            <div id="historyList"></div>
            <button id="clearHistoryBtn" class="danger">🗑 Очистить историю</button>
        </div>
    </div>

    <!-- Модальное окно точек -->
    <div id="pointsModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closePointsModal">&times;</span>
            <h2>📌 Ежедневные точки</h2>
            <div class="points-form">
                <input type="date" id="pointDate">
                <input type="number" id="pointCount" placeholder="Кол-во" min="0" step="1">
                <button id="addPointBtn">➕ Добавить</button>
            </div>
            <div id="pointsList" style="margin-top:15px;"></div>
            <div id="pointsTotal" style="margin:10px 0; font-weight:bold;"></div>
            <button id="clearPointsBtn" class="danger">🗑 Очистить всё</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
