<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Калькулятор путевых листов</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📄 Калькулятор путевых листов</h1>

        <!-- Блок настроек -->
        <div class="settings-panel">
            <h3>⚙️ Параметры расчёта</h3>
            <div class="setting-row">
                <label>🛣 Пробег город (км):</label>
                <input type="number" id="cityKm" placeholder="0" step="0.1">
            </div>
            <div class="setting-row">
                <label>🛤 Пробег трасса (км):</label>
                <input type="number" id="highwayKm" placeholder="0" step="0.1">
            </div>
            <div class="setting-row">
                <label>⛽ Заправлено (л):</label>
                <input type="number" id="fuelAddedManual" placeholder="0" step="0.1">
                <small>Оставьте пустым, если OCR найдёт сам</small>
            </div>
            <div class="setting-row">
                <label>☀️ Норма летняя (л/100км):</label>
                <input type="number" id="normSummer" value="10.0" step="0.1">
            </div>
            <div class="setting-row">
                <label>❄️ Норма зимняя (л/100км):</label>
                <input type="number" id="normWinter" value="12.0" step="0.1">
            </div>
            <div class="setting-row season-select">
                <span>📅 Сезон:</span>
                <label><input type="radio" name="season" value="auto" checked> Авто (по погоде)</label>
                <label><input type="radio" name="season" value="winter"> Зима</label>
                <label><input type="radio" name="season" value="summer"> Лето</label>
            </div>
            <div id="weatherInfo" class="weather-info"></div>
        </div>

        <button id="startButton">📷 Запустить камеру</button>
        <button id="historyButton" class="secondary">📋 История</button>

        <div class="camera-section">
            <div class="video-container">
                <video id="video" playsinline autoplay></video>
                <button id="captureButton" disabled>📸 Сфотографировать и распознать</button>
            </div>
            <div id="messageBox">
                <div id="rawText"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: РЕЗУЛЬТАТЫ -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeResultModal">&times;</span>
            <h2>📊 Результаты расчёта</h2>
            <div id="modalCalculations"></div>
            <div class="modal-actions">
                <button id="saveToHistoryBtn">💾 Сохранить в историю</button>
                <button id="closeResultBtn" class="secondary">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: ИСТОРИЯ -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeHistoryModal">&times;</span>
            <h2>📚 Сохранённые расчёты</h2>
            <div id="historyList"></div>
            <button id="clearHistoryBtn" class="danger">🗑 Очистить историю</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
