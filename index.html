<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Калькулятор путевых листов</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📄 Калькулятор путевых листов</h1>

        <!-- НАСТРОЙКИ НОРМ -->
        <div class="settings-panel">
            <h3>⚙️ Нормы (л/100км)</h3>
            <div class="norm-row">
                <span>🏙️ Город:</span>
                <label>Лето <input type="number" id="normCitySummer" value="11.0" step="0.1"></label>
                <label>Зима <input type="number" id="normCityWinter" value="13.0" step="0.1"></label>
            </div>
            <div class="norm-row">
                <span>🛣️ Трасса:</span>
                <label>Лето <input type="number" id="normHwySummer" value="9.0" step="0.1"></label>
                <label>Зима <input type="number" id="normHwyWinter" value="11.0" step="0.1"></label>
            </div>
            <div class="season-row">
                <span>📅 Сезон:</span>
                <label><input type="radio" name="season" value="auto" checked> Авто</label>
                <label><input type="radio" name="season" value="winter"> ❄️ Зима</label>
                <label><input type="radio" name="season" value="summer"> ☀️ Лето</label>
            </div>
            <div id="weatherInfo" class="weather-info"></div>
        </div>

        <!-- КАМЕРА ДЛЯ ДАТЫ -->
        <div class="camera-mini">
            <div class="camera-preview">
                <video id="video" playsinline autoplay></video>
                <button id="scanDateBtn" disabled>📸 Сканировать дату</button>
            </div>
            <div id="scanStatus" class="scan-status"></div>
        </div>

        <!-- ПОЛЯ ВВОДА -->
        <div class="input-grid">
            <div class="input-item">
                <label>📅 Дата:</label>
                <input type="date" id="dateInput">
            </div>
            <div class="input-item">
                <label>⛽ Остаток при выезде (л):</label>
                <input type="number" id="startFuel" step="0.1" placeholder="0">
                <small id="startFuelHint"></small>
            </div>
            <div class="input-item">
                <label>🏁 Остаток при возврате (л):</label>
                <input type="number" id="endFuel" step="0.1" placeholder="0">
            </div>
            <div class="input-item">
                <label>🏙️ Пробег город (км):</label>
                <input type="number" id="cityKm" step="0.1" placeholder="0">
            </div>
            <div class="input-item">
                <label>🛣️ Пробег трасса (км):</label>
                <input type="number" id="highwayKm" step="0.1" placeholder="0">
            </div>
            <div class="input-item">
                <label>🛢️ Заправлено (л):</label>
                <input type="number" id="fuelAdded" step="0.1" placeholder="0">
            </div>
        </div>

        <!-- РЕЗУЛЬТАТЫ (живые) -->
        <div id="resultsBlock" class="results-live">
            <h3>📊 Расчёт</h3>
            <div id="liveResults"></div>
        </div>

        <!-- КНОПКИ -->
        <div class="btn-group">
            <button id="saveBtn">💾 Сохранить в историю</button>
            <button id="historyBtn" class="secondary">📋 История</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ИСТОРИИ -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeHistoryModal">&times;</span>
            <h2>📚 Сохранённые расчёты</h2>
            <div id="historyList"></div>
            <button id="clearHistoryBtn" class="danger">🗑 Очистить историю</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
