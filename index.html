<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Калькулятор путевых листов</title>
    <!-- Подключаем библиотеку для распознавания текста (работает офлайн в браузере!) -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📄 Калькулятор путевых листов</h1>
        <button id="startButton">Запустить камеру</button>

        <div class="camera-section">
            <div class="video-container">
                <video id="video" playsinline autoplay></video>
                <button id="captureButton" disabled>Сфотографировать и распознать</button>
            </div>
            <div id="resultSection">
                <h2>Результаты:</h2>
                <div id="rawText"></div>
                <div id="calculations"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
